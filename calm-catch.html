<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тихий пруд — спокойная аркада</title>
<style>
  html,body{margin:0;height:100%;background:#0e1a2b;overflow:hidden;font-family:system-ui,sans-serif;color:#dfeaff;touch-action:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font-size:18px;letter-spacing:.5px;opacity:.85}
  #mute{pointer-events:auto;background:none;border:1px solid #8fb4ff66;color:#dfeaff;border-radius:20px;padding:4px 14px;font-size:15px;cursor:pointer}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1a2bee;text-align:center;padding:24px;cursor:pointer;transition:opacity 1s}
  #start h1{font-weight:300;font-size:38px;margin:0 0 12px;letter-spacing:2px}
  #start p{margin:4px 0;opacity:.75;max-width:360px;line-height:1.5}
  #start .go{margin-top:26px;border:1px solid #8fb4ff;border-radius:28px;padding:10px 30px;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="score">Светлячки: 0</div><button id="mute">Музыка: вкл</button></div>
<div id="start">
  <h1>Тихий пруд</h1>
  <p>Лодочка плывёт по ночному пруду. Ловите падающих светлячков.</p>
  <p>Двигайте мышью, пальцем или стрелками ←/→.</p>
  <p>Проиграть нельзя — просто наслаждайтесь.</p>
  <div class="go">Начать</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

/* ---------- Музыка: генеративная пентатоника + мягкий пэд ---------- */
let ac=null,master,musicOn=true,musicTimer=null;
const scale=[0,2,4,7,9];            // мажорная пентатоника
const root=174.61;                  // F3
const freq=(deg,oct=0)=>root*Math.pow(2,(scale[((deg%5)+5)%5]+12*(Math.floor(deg/5)+oct))/12);
function tone(f,t,dur,vol,type='sine'){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+dur*0.25);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function initAudio(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=0.5;
  // простая «реверберация» из импульса шума
  const len=ac.sampleRate*3,buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  const conv=ac.createConvolver();conv.buffer=buf;
  const wet=ac.createGain();wet.gain.value=0.45;
  master.connect(ac.destination);master.connect(conv);conv.connect(wet);wet.connect(ac.destination);
  schedule();
}
const chords=[[0,2,4],[ -2,0,2],[ -3,-1,1],[ -1,1,3]];   // плавная последовательность аккордов
let nextChord=0,chordIdx=0,nextNote=0;
function schedule(){
  clearInterval(musicTimer);
  nextChord=nextNote=ac.currentTime+0.1;
  musicTimer=setInterval(()=>{
    if(!musicOn)return;
    const now=ac.currentTime;
    while(nextChord<now+1){            // пэд: 8 секунд на аккорд
      chords[chordIdx%chords.length].forEach(d=>{
        tone(freq(d,-1),nextChord,9,0.05,'sine');
        tone(freq(d,-1)*1.003,nextChord,9,0.03,'triangle');
      });
      chordIdx++;nextChord+=8;
    }
    while(nextNote<now+1){             // мелодия: редкие мягкие ноты
      if(Math.random()<0.7){
        const ch=chords[(chordIdx-1+chords.length)%chords.length];
        const d=Math.random()<0.6?ch[Math.floor(Math.random()*3)]+5:Math.floor(Math.random()*8)-1+5;
        tone(freq(d),nextNote,3.5,0.07,'sine');
      }
      nextNote+=1.6+Math.random()*1.6;
    }
  },250);
}
function chime(){            // звук поимки светлячка
  if(!ac||!musicOn)return;
  const d=Math.floor(Math.random()*5)+6;
  tone(freq(d),ac.currentTime,1.8,0.09,'sine');
  tone(freq(d)*2,ac.currentTime,1.2,0.025,'sine');
}
document.getElementById('mute').onclick=e=>{
  e.stopPropagation();musicOn=!musicOn;
  master&&(master.gain.value=musicOn?0.5:0);
  e.target.textContent='Музыка: '+(musicOn?'вкл':'выкл');
};

/* ---------- Игра ---------- */
const boat={x:W/2,target:W/2,w:90};
let keys={},score=0,flies=[],ripples=[],t=0,started=false;
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*0.5,r:Math.random()*1.4+0.3,p:Math.random()*6}));
addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);
addEventListener('pointermove',e=>{boat.target=e.clientX});
addEventListener('pointerdown',e=>{boat.target=e.clientX});
document.getElementById('start').onclick=()=>{
  initAudio();ac.resume();started=true;
  const s=document.getElementById('start');s.style.opacity=0;setTimeout(()=>s.remove(),1000);
};

function spawn(){
  flies.push({x:40+Math.random()*(W-80),y:-20,vy:30+Math.random()*25,ph:Math.random()*6,amp:15+Math.random()*20,base:0});
  flies[flies.length-1].base=flies[flies.length-1].x;
}
let spawnT=0;
function update(dt){
  t+=dt;
  if(keys.ArrowLeft||keys.a)boat.target-=360*dt;
  if(keys.ArrowRight||keys.d)boat.target+=360*dt;
  boat.target=Math.max(boat.w/2,Math.min(W-boat.w/2,boat.target));
  boat.x+=(boat.target-boat.x)*Math.min(1,dt*4);   // плавное движение
  if(started){spawnT-=dt;if(spawnT<=0){spawn();spawnT=1.6+Math.random()*1.4}}
  const waterY=H*0.62,boatY=waterY+8;
  for(const f of flies){
    f.y+=f.vy*dt;f.x=f.base+Math.sin(t*1.2+f.ph)*f.amp;
    if(!f.caught&&f.y>boatY-30&&f.y<boatY+10&&Math.abs(f.x-boat.x)<boat.w/2){
      f.caught=true;score++;chime();
      document.getElementById('score').textContent='Светлячки: '+score;
      ripples.push({x:f.x,y:waterY+16,r:5,a:.6,glow:true});
    }
    if(!f.caught&&f.y>waterY+14){f.caught=true;f.missed=true;ripples.push({x:f.x,y:waterY+16,r:4,a:.35})}
  }
  flies=flies.filter(f=>!f.caught);
  ripples.forEach(r=>{r.r+=28*dt;r.a-=0.25*dt});
  ripples=ripples.filter(r=>r.a>0);
}

function draw(){
  const waterY=H*0.62;
  // небо
  let g=ctx.createLinearGradient(0,0,0,waterY);g.addColorStop(0,'#0a1226');g.addColorStop(1,'#26406b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,waterY);
  // звёзды
  for(const s of stars){ctx.globalAlpha=0.5+0.5*Math.sin(t*0.8+s.p);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  // луна
  const mx=W*0.8,my=H*0.16;
  let mg=ctx.createRadialGradient(mx,my,10,mx,my,90);mg.addColorStop(0,'#fff6d8aa');mg.addColorStop(1,'#fff6d800');
  ctx.fillStyle=mg;ctx.fillRect(mx-100,my-100,200,200);
  ctx.fillStyle='#fff6d8';ctx.beginPath();ctx.arc(mx,my,28,0,7);ctx.fill();
  // холмы
  ctx.fillStyle='#10213d';ctx.beginPath();ctx.moveTo(0,waterY);
  for(let x=0;x<=W;x+=20)ctx.lineTo(x,waterY-30-Math.sin(x*0.006+1)*26-Math.sin(x*0.017)*8);
  ctx.lineTo(W,waterY);ctx.fill();
  // вода
  g=ctx.createLinearGradient(0,waterY,0,H);g.addColorStop(0,'#1b3358');g.addColorStop(1,'#0a1428');
  ctx.fillStyle=g;ctx.fillRect(0,waterY,W,H-waterY);
  // отражение луны
  ctx.fillStyle='#fff6d818';
  for(let i=0;i<8;i++){const w=60-i*5+Math.sin(t+i)*8;ctx.fillRect(mx-w/2,waterY+10+i*16,w,3)}
  // рябь
  for(const r of ripples){
    ctx.strokeStyle=(r.glow?'rgba(255,240,150,':'rgba(160,200,255,')+r.a+')';
    ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r*2,r.r*0.6,0,0,7);ctx.stroke();
  }
  // лодка
  const by=waterY+8+Math.sin(t*1.5)*2,bx=boat.x,bw=boat.w;
  ctx.save();ctx.translate(bx,by);ctx.rotate(Math.sin(t*1.5+1)*0.03);
  ctx.fillStyle='#8a5a3a';ctx.beginPath();ctx.moveTo(-bw/2,-6);ctx.lineTo(bw/2,-6);ctx.lineTo(bw/2-14,14);ctx.lineTo(-bw/2+14,14);ctx.closePath();ctx.fill();
  ctx.fillStyle='#a8744d';ctx.fillRect(-bw/2,-9,bw,5);
  // фонарик
  ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(0,-18,6,0,7);ctx.fill();
  let lg=ctx.createRadialGradient(0,-18,2,0,-18,50);lg.addColorStop(0,'#ffd27a88');lg.addColorStop(1,'#ffd27a00');
  ctx.fillStyle=lg;ctx.fillRect(-55,-70,110,110);
  ctx.restore();
  // светлячки
  for(const f of flies){
    const p=0.6+0.4*Math.sin(t*4+f.ph);
    let fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,22);
    fg.addColorStop(0,`rgba(220,255,140,${0.9*p})`);fg.addColorStop(1,'rgba(220,255,140,0)');
    ctx.fillStyle=fg;ctx.fillRect(f.x-24,f.y-24,48,48);
    ctx.fillStyle='#f6ffc2';ctx.beginPath();ctx.arc(f.x,f.y,3,0,7);ctx.fill();
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
